<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div id="show" class="display"></div>
        <div class="keys">
            <button onclick="action('-')" class="btn-action">-</button>
            <button onclick="action('+')" class="btn-action">+</button>
            <button onclick="action('/')" class="btn-action">/</button>
            <button onclick="action('*')" class="btn-action">x</button>

            <button onclick="number(9)" class="btn number">9</button>
            <button onclick="number(8)" class="btn number">8</button>
            <button onclick="number(7)" class="btn number">7</button>
            <button onclick="number(6)" class="btn number">6</button>

            <button onclick="number(5)" class="btn number">5</button>
            <button onclick="number(4)" class="btn number">4</button>
            <button onclick="number(3)" class="btn number">3</button>
            <button onclick="number(2)" class="btn number">2</button>

            <button onclick="number(1)" class="btn number">1</button>
            <button onclick="number(0)" class="btn number">0</button>
            <button onclick="cleared()" class="btn-clear">C</button>
            <button onclick="clearone()" class="btn del">DEL</button>
            <button onclick='equal()' class="btn-equal">=</button>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
